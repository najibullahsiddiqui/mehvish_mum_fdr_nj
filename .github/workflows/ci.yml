name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creatorpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creatorpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/creatorpilot?schema=public
      LLM_PROVIDER: mock
      ALLOW_PAID_AI: "false"
      ALLOW_CLOUD_AI: "false"
      RUNPOD_ENABLED: "false"
      LOCAL_TTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
